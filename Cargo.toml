[package]
name = "multipass-scanner"
version = "0.1.0"
edition = "2021"
description = "Scan a photo in two to four orientations on an Epson flatbed and combine the scans into one cleaner image"
license = "GPL-3.0-or-later"

# The app, and the scanner backends as a crate of their own (no OpenCV, no GUI).
[workspace]
members = ["crates/flatbed"]

[dependencies]
# the scanner: one interface, one backend per operating system
flatbed = { path = "crates/flatbed" }
# The window's renderer is chosen per system below.
eframe = { version = "0.37", default-features = false, features = ["default_fonts"] }
opencv = { version = "0.102", default-features = false, features = ["imgproc", "features2d", "video", "calib3d", "imgcodecs", "geometry"] }
rayon = "1.10"

# Linux and macOS draw the window with OpenGL.  "wayland" and "x11" only have
# an effect on Linux.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
# GNOME on Wayland leaves window decorations to the app.  This turns on winit's
# Adwaita-style title bar (matching other GNOME apps) instead of its plain
# fallback frame.  Same winit version as eframe, so the feature applies to it.
# Other systems draw the title bar themselves.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows draws the window with Direct3D 12 through wgpu, not OpenGL.  Windows
# only offers OpenGL 1.1 unless a graphics driver adds more, which virtual
# machines and Remote Desktop sessions often lack, while Direct3D 12 is always
# there: without a usable GPU, Windows' built-in software renderer (WARP)
# serves it.  Only wgpu's Direct3D 12 backend is built.
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
# installed memory, the Pictures folder, output to the terminal the app is run from
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_UI_Shell",
] }

# Puts the icon into the .exe (build.rs).  Build dependencies go by the system
# the build runs on, and the app is built for Windows on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"

[profile.dev]
opt-level = 2
